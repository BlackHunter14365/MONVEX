name: MONVEX Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monvex_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Isolation Tests
        working-directory: backend
        env:
          SECRET_KEY: test-ci-secret-key-64-character-production-test-only
          DEBUG: 'False'
          DB_ENGINE: 'postgres'
          DB_NAME: monvex_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          python manage.py test tests --verbosity=2

  frontend-build:
    name: Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install NPM Dependencies
        working-directory: web
        run: npm ci

      - name: Run Next.js Production Build
        working-directory: web
        run: npm run build

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: monvex-backend:test

      - name: Build Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: false
          tags: monvex-web:test

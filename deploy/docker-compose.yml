version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: monvex_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-monvex_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monvex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: monvex_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - monvex_network

  # Django Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: monvex_backend
    restart: always
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api.monvex.ai}
      DB_ENGINE: "postgres"
      DB_NAME: ${DB_NAME:-monvex_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pwd}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - monvex_network

  # Next.js Web Frontend
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: monvex_web
    restart: always
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: "http://backend:8000/api/"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - monvex_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: monvex_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - backend
    networks:
      - monvex_network

networks:
  monvex_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

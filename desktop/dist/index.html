<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONVEX — Financial Intelligence</title>
  <meta http-equiv="refresh" content="0;url=https://monvex-web.onrender.com">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563EB, #4F46E5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.05em;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #2563EB;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
    p {
      font-size: 0.85rem;
      color: #94A3B8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="brand-container">
    <div class="logo-badge">M</div>
    <div class="spinner"></div>
    <h1>MONVEX Desktop</h1>
    <p>Connecting to production financial intelligence cloud...</p>
  </div>
  <script>
    // Immediate programmatic navigation to live production web app
    window.location.href = "https://monvex-web.onrender.com";
  </script>
</body>
</html>

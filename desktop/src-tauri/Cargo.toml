[package]
name = "monvex-desktop"
version = "2.0.0"
description = "MONVEX Desktop Native Financial Intelligence Shell"
authors = ["MONVEX Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
    "shell-open",
    "system-tray",
    "window-hide",
    "window-show",
    "window-maximize",
    "window-minimize",
    "window-close",
    "window-set-focus",
    "window-set-title",
    "global-shortcut-all",
    "notification-all",
    "dialog-open",
    "dialog-save",
    "fs-write-file",
    "fs-read-file"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

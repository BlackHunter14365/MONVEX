# Render Infrastructure Blueprint for MONVEX Financial Intelligence Platform
# Documentation: https://render.com/docs/infrastructure-as-code
# Architecture: Dual Web Services (Backend + Frontend) connected to external Neon PostgreSQL

services:
  # =========================================================================
  # 1. MONVEX BACKEND (Django REST Framework + Gunicorn + WhiteNoise)
  # =========================================================================
  - type: web
    name: monvex-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    preDeployCommand: "python manage.py migrate --no-input"
    startCommand: "gunicorn monvex.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: monvex.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # Neon PostgreSQL connection string (Provided by operator in Render dashboard)
      # e.g., postgresql://user:password@ep-xyz.region.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://monvex-web.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://monvex-web.onrender.com,https://monvex-backend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_PROVIDER
        value: "smtp"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_HOST_USER
        value: "monvexfinance@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        value: "MONVEX <monvexfinance@gmail.com>"
      - key: SERVER_EMAIL
        value: "monvexfinance@gmail.com"

  # =========================================================================
  # 2. MONVEX WEB (Next.js 14 Standalone / SSR Application)
  # =========================================================================
  - type: web
    name: monvex-web
    runtime: node
    rootDir: web
    plan: free
    region: oregon
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NEXT_PUBLIC_API_URL
        value: "https://monvex-backend.onrender.com/api/v1"
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false

# =========================================================================
# DATABASE NOTE:
# Render managed PostgreSQL has been removed to utilize the existing Neon
# PostgreSQL database. Neon offers connection pooling, automatic serverless
# branching, and zero data duplication.
# Provide DATABASE_URL in the Render dashboard for monvex-backend with:
# postgresql://<user>:<password>@<neon-host>/<db-name>?sslmode=require
# =========================================================================
